<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Android: color the status bar to match the map's land background -->
    <meta name="theme-color" content="#f5f3f0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f3f0"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1a1f2e"
    />
    <!-- iOS: allow content to extend under the status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PalaSumbong</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clear any stale service worker caches so phone gets fresh CSS/JS
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (var reg of registrations) {
              reg.unregister();
            }
          });
        caches.keys().then(function (names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
